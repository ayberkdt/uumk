  <path d="M474 67v-7" class="i"/><rect class="radar" x="467" y="56" width="15" height="3.4" rx="1.2" fill="#4a4a48"/>
  <!-- pist -->
  <rect x="40" y="158" width="560" height="32" fill="#cfcdc6"/><path d="M40 158H600" class="i"/>
  <path d="M60 176h36M130 176h36M200 176h36M270 176h36M340 176h36M410 176h36M480 176h36M550 176h36" stroke="#f2c200" stroke-width="2.4"/>
  <!-- taksi eden yolcu uçağı (yandan): dikey kuyruk, gövde, alt gölge, şerit, pencereler, kapılar, kokpit, kanat, motor, iniş takımı, lambalar -->
  <g class="ucak">
    <g transform="translate(0 116)">
      <path d="M8 29l-14 2.6l1.6 2.4l26-2.6z" fill="#cfcdc6" class="i"/>
      <path d="M10 24L0-2h14l26 22z" fill="#056b7a" class="i"/><path d="M3.1 6h20.4l4.7 4H4.6z" fill="#f2c200"/>
      <path d="M2 24L24 20h126c14 0 24 5 30 11c-5 6-15 9-30 9H40C26 40 12 33 2 24z" fill="#f8f8f6"/>
