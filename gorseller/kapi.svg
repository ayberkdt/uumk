<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300">
<!-- Boş gündem çizimi (v13): A1 kapısı kapalı, kayıt bankosu kapalı levhalı, kemerli bariyer çekili, koltukta kedi uyuyor; camın
     ardında kule (radar döner, tepe lambası yanar), rüzgâr tulumu dalgalanır, yolcu uçağı taksi eder (çakar lambaları), uzakta bir uçak
     kalkar, bulutlar kayar. Telefonda ortadan 4:3 kırpılır (x 120–520): kapı tabelası, levha, bariyer, kedi ve kule o aralıkta.
     Hareket azaltmada her şey durur. Renkler site paletinden. -->
<style>
.c{stroke:#141414;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.i{stroke:#141414;stroke-width:1.2;stroke-linejoin:round;stroke-linecap:round}
.ucak{animation:taksi 26s linear infinite}
.uzak{animation:uzak 19s linear infinite}
.bulut{animation:bulut 30s ease-in-out infinite alternate}
.z{opacity:0;animation:z 3.6s ease-out infinite}
.z2{animation-delay:1.2s}.z3{animation-delay:2.4s}
.lamba{animation:lamba 2.4s ease-in-out infinite}
.flas{animation:flas 1.3s linear infinite}.flas2{animation-delay:.65s}
.radar{transform-box:fill-box;transform-origin:50% 50%;animation:radar 2.6s ease-in-out infinite}
.tulum{transform-box:fill-box;transform-origin:0 50%;animation:tulum 2.2s ease-in-out infinite alternate}
.yaprak{transform-box:fill-box;transform-origin:50% 100%;animation:yaprak 4.4s ease-in-out infinite alternate}
.nefes{transform-box:fill-box;transform-origin:50% 100%;animation:nefes 3.6s ease-in-out infinite}
.kuyruk{transform-box:fill-box;transform-origin:0% 50%;animation:kuyruk 5s ease-in-out infinite}
@keyframes taksi{from{transform:translateX(-230px)}to{transform:translateX(700px)}}
@keyframes uzak{from{transform:translate(20px,120px)}to{transform:translate(660px,-30px)}}
@keyframes bulut{to{transform:translateX(-90px)}}
@keyframes z{0%{opacity:0;transform:translate(0,0)}25%{opacity:1}100%{opacity:0;transform:translate(14px,-30px)}}
@keyframes lamba{50%{opacity:.3}}
@keyframes flas{0%,12%{opacity:1}14%,100%{opacity:.12}}
@keyframes radar{50%{transform:scaleX(.1)}}
@keyframes tulum{to{transform:skewY(5deg) scaleX(.9)}}
@keyframes yaprak{to{transform:rotate(3deg)}}
@keyframes nefes{50%{transform:scaleY(1.06)}}
@keyframes kuyruk{50%{transform:rotate(9deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.z1{opacity:1}.uzak{display:none}}
</style>
<defs><clipPath id="cam"><rect x="40" y="34" width="560" height="156"/></clipPath></defs>
<rect width="640" height="300" fill="#ecebe7"/>
<!-- cam ve dışarısı -->
<rect x="40" y="34" width="560" height="156" fill="#dfeaeb"/>
<g clip-path="url(#cam)">
  <g class="bulut">
    <path d="M90 78h62a12 12 0 0 0-14-14a17 17 0 0 0-30-4a13 13 0 0 0-18 18z" fill="#f8f8f6" class="i"/>
    <path d="M300 62h48a10 10 0 0 0-11-11a13 13 0 0 0-23-3a10 10 0 0 0-14 14z" fill="#f8f8f6" class="i"/>
    <path d="M540 84h56a11 11 0 0 0-12-12a15 15 0 0 0-27-4a12 12 0 0 0-17 16z" fill="#f8f8f6" class="i"/>
  </g>
  <!-- uzakta kalkan uçak -->
  <g class="uzak"><path d="M0 7l20-4q6-1 7 1.4q-1 2.4-7 3L3 9z" fill="#85837e"/><path d="M9 6l-4-6h3.4l7.4 5.4zM1 6.6l-2-4h2.4l3 3.4z" fill="#85837e"/></g>
  <!-- rüzgâr tulumu -->
  <path d="M80 158v-46" class="i"/>
  <g class="tulum"><path d="M80 112l9 1.2v11.6l-9 1.2z" fill="#a4262c" class="i"/><path d="M89 113.2l8 1v9.6l-8 1z" fill="#f8f8f6" class="i"/><path d="M97 114.2l8 1.2v7.2l-8 1.2z" fill="#a4262c" class="i"/></g>
  <!-- kontrol kulesi: gövde, bantlar, cam kabin, çatı, direk lambası, dönen radar -->
  <path d="M438 158v-12h44v12z" fill="#f8f8f6" class="i"/><rect x="455" y="150" width="10" height="8" fill="#03525e"/>
  <path d="M446 146l4-48h20l4 48z" fill="#f8f8f6" class="i"/>
  <path d="M448.4 130h23.2M449.6 115h20.8" stroke="#056b7a" stroke-width="2.2"/>
  <path d="M438 98h44v-5h-44z" fill="#cfcdc6" class="i"/>
  <path d="M440 93l-6-20h52l-6 20z" fill="#1d3a40" class="i"/>
  <path d="M447.5 93l-3-20M460 93v-20M472.5 93l3-20" stroke="#8fb9bf" stroke-width="1.2"/>
  <path d="M439 85l7-8M452 85l5-6" stroke="#dfeaeb" stroke-width="1.4" opacity=".55"/>
  <path d="M430 73h60l-7-6h-46z" fill="#056b7a" class="i"/>
