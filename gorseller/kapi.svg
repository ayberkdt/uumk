      <path d="M24 31.6h148" stroke="#056b7a" stroke-width="2.6"/><path d="M30 34.4h138" stroke="#f2c200" stroke-width="1"/>
      <path d="M2 24L24 20h126c14 0 24 5 30 11c-5 6-15 9-30 9H40C26 40 12 33 2 24z" fill="none" class="i"/>
      <g fill="#03525e"><circle cx="46" cy="26.4" r="1.5"/><circle cx="52.5" cy="26.4" r="1.5"/><circle cx="59" cy="26.4" r="1.5"/><circle cx="65.5" cy="26.4" r="1.5"/><circle cx="72" cy="26.4" r="1.5"/><circle cx="78.5" cy="26.4" r="1.5"/><circle cx="85" cy="26.4" r="1.5"/><circle cx="91.5" cy="26.4" r="1.5"/><circle cx="98" cy="26.4" r="1.5"/><circle cx="104.5" cy="26.4" r="1.5"/><circle cx="111" cy="26.4" r="1.5"/><circle cx="117.5" cy="26.4" r="1.5"/><circle cx="124" cy="26.4" r="1.5"/><circle cx="130.5" cy="26.4" r="1.5"/><circle cx="137" cy="26.4" r="1.5"/><circle cx="143.5" cy="26.4" r="1.5"/></g>
      <rect x="152" y="22.4" width="6" height="12" rx="1.6" fill="none" class="i"/><rect x="34" y="22.8" width="5.6" height="11.6" rx="1.6" fill="none" class="i"/>
      <path d="M163 24.4h7.6l4.2 4.2h-11.8z" fill="#1d3a40"/><path d="M167.4 24.4v4.2M171.2 24.4l1.6 4.2" stroke="#f8f8f6" stroke-width=".8"/>
      <path d="M82 40v15M166 40v15" class="i"/>
      <circle cx="78" cy="56" r="4" fill="#141414"/><circle cx="87" cy="56" r="4" fill="#141414"/><circle cx="166" cy="56.4" r="3.6" fill="#141414"/>
      <circle cx="78" cy="56" r="1.4" fill="#85837e"/><circle cx="87" cy="56" r="1.4" fill="#85837e"/><circle cx="166" cy="56.4" r="1.2" fill="#85837e"/>
      <path d="M70 36h40l26 10h-10z" fill="#cfcdc6" class="i"/>
      <path d="M106 39l3 3h8l-2-3z" fill="#cfcdc6" class="i"/>
      <rect x="98" y="41" width="34" height="11" rx="5.5" fill="#f8f8f6" class="i"/><path d="M112 41.4v10.2" stroke="#056b7a" stroke-width="2.6"/>
      <ellipse cx="131.4" cy="46.5" rx="2" ry="4.6" fill="#141414"/><path d="M98 44l-5 2.5l5 2.5z" fill="#4a4a48"/>
      <circle class="flas" cx="96" cy="19.6" r="2" fill="#a4262c"/><circle class="flas flas2" cx="120" cy="40.4" r="1.8" fill="#a4262c"/>
      <circle class="flas flas2 i" cx="3" cy="24" r="1.7" fill="#f8f8f6"/><circle cx="166" cy="48" r="1.6" fill="#f2c200"/>
    </g>
  </g>
</g>
<rect x="40" y="34" width="560" height="156" fill="none" class="c"/>
<path d="M170 34v156M320 34v156M470 34v156" class="c"/>
<!-- tavandan sarkan kapı tabelası ve kalkış ekranı -->
<path d="M154 0v14M234 0v14" class="i"/>
<rect x="136" y="14" width="116" height="40" rx="5" fill="#1a1a1a" class="c"/>
<text x="156" y="44" font-family="Futura, 'Century Gothic', 'Segoe UI', sans-serif" font-size="24" font-weight="700" fill="#f2c200">A1</text>
